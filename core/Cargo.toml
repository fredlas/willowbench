[package]
name = "core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
local-debug = []

[dependencies]
actix-web = "4"
actix-cors = "0.6"
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }
lazy_static = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0.133"
json = "0.12"
rand = "0.8.5"
tokio = { version = "1.41.1", features = ["full"] }
mongodb = "3.1.0"
base64 = "0.22"
log = "0.4.27"
simplelog = "0.12.2"
time = "0.3.41"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
